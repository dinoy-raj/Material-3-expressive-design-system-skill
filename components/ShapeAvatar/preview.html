<!doctype html>
<html>
<head><meta charset="utf-8"><title>ShapeAvatar preview</title></head>
<body>
<div id="root"></div>
<script>
  var E = window.Expressive, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(function ShapeDemo() {
    var tones = ['highlight','primary-container','secondary','tertiary-container','primary','positive','secondary-container'];
    var seq = ['cookie9','flower8','heart','gem','clover4','sunny'];
    var s = React.useState(0);
    React.useEffect(function () { var id = setInterval(function () { s[1](function (x) { return (x + 1) % seq.length; }); }, 1600); return function () { clearInterval(id); }; }, []);
    return h('div', { className: 'ex-stage' },
      h('div', { className: 'ex-row', style: { gap: '10px' } }, E.ShapeAvatar.shapes.map(function (name, i) {
        return h(E.ShapeAvatar, { key: name, shape: name, size: 40, tone: tones[i % tones.length], label: name });
      })),
      h('div', { className: 'ex-row', style: { gap: '16px', marginTop: '8px' } },
        h(E.ShapeAvatar, { shape: seq[s[0]], size: 88, tone: 'primary', icon: 'favorite', label: 'Morphing shape' }),
        h(E.ShapeAvatar, { shape: 'flower8', size: 88, tone: 'tertiary-container', icon: 'music_note', spin: true, label: 'Trill' })));
  }));
</script>
</body>
</html>
